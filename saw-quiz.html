function setVol(){if(master)master.gain.setTargetAtTime(baseVol(),AC.currentTime,.4)}
function noiseBuf(d){const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),x=b.getChannelData(0);for(let k=0;k<x.length;k++)x[k]=Math.random()*2-1;return b}
function thump(t0,f,v){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(34,t0+.18);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+.3);o.connect(g).connect(master);o.start(t0);o.stop(t0+.32)}
function beat(){if(AC&&mus){const t=AC.currentTime;thump(t,62,.9);thump(t+.22,55,.6)}setTimeout(beat,beatMs)}
function whisper(){
  if(AC&&mus){const t=AC.currentTime;[698,740].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+2);g.gain.linearRampToValueAtTime(0,t+5);o.connect(g).connect(master);o.start(t);o.stop(t+5.2)})}
  setTimeout(whisper,7000+Math.random()*8000);
}
function sting(){
  if(!AC||!mus)return;const t=AC.currentTime;
  const n=AC.createBufferSource();n.buffer=noiseBuf(.8);
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(3000,t);bp.frequency.exponentialRampToValueAtTime(300,t+.7);
  const g=AC.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);n.connect(bp).connect(g).connect(AC.destination);n.start(t);
  const o=AC.createOscillator(),g2=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(40,t+.7);
  g2.gain.setValueAtTime(.3,t);g2.gain.exponentialRampToValueAtTime(.001,t+.8);o.connect(g2).connect(AC.destination);o.start(t);o.stop(t+.85);
}
function startMusic(){
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  if(!AC)AC=new A();AC.resume();if(master)return;
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=200;lp.Q.value=5;lp.connect(master);
  [[55,'sawtooth',.3],[55.8,'sawtooth',.3],[82.4,'triangle',.18],[110.9,'sine',.08]].forEach(([f,ty,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g).connect(lp);o.start()});
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.07;lg.gain.value=110;l.connect(lg).connect(lp.frequency);l.start();
  setVol();beat();setTimeout(whisper,4000);
}

/* Voz de Billy */
function say(t,show=true){
  return new Promise(res=>{
    if(show)$('#sub').textContent=t;stage.classList.add('talk');talking=true;setVol();
    let done=false;const end=()=>{if(done)return;done=true;stage.classList.remove('talk');talking=false;setVol();res()};
    if(voz&&synth){synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=V?V.lang:'es-MX';if(V)u.voice=V;u.pitch=.2;u.rate=.85;u.onend=end;u.onerror=end;synth.speak(u);setTimeout(end,t.length*110+3000)}
    else setTimeout(end,Math.min(t.length*45+600,4000));
  });
}
const NUM=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez'];
function countdown(s){
  const c=$('#count');c.classList.remove('hide');c.style.animation='none';void c.offsetWidth;c.style.animation='';c.textContent=s;beatMs=s<=3?450:700;
  if(voz&&synth){synth.cancel();const u=new SpeechSynthesisUtterance(NUM[s]);u.lang=V?V.lang:'es-MX';if(V)u.voice=V;u.pitch=.2;u.rate=s<=3?.8:1;synth.speak(u)}
}

/* Juego */
function hud(){$('#vidas').innerHTML=[0,1,2].map(n=>'<span class="'+(n<vidas?'':'off')+'"></span>').join('')}
function showMenu(){
  ['#tag','#q','#in','#bar','#count','#hud'].forEach(s=>vis(s,false));vis('#menu',true);
  $('#title').textContent='¿Quieres jugar un juego?';$('#all').textContent='Jugar las 4 pruebas';
}
async function run(list){
  const g=++gid;q=list;qi=0;vidas=3;startMusic();beatMs=1600;clearInterval(timer);
  vis('#menu',false);['#tag','#q','#in','#bar','#count'].forEach(s=>vis(s,false));vis('#hud',true);hud();
  $('#title').textContent='Prepárate';
  await say(list.length>1?'Hola, jugador. Quiero jugar un juego. Superarás cuatro pruebas. Tienes tres vidas. Empecemos.':'Muy bien. Una sola prueba y tres vidas. Empecemos.');
  prueba(g);
}
async function prueba(g){
  if(g!==gid)return;
  if(qi>=q.length)return fin(g,true);
  const p=P[q[qi]];
  $('#tag').textContent=p.tag;vis('#tag',true);$('#title').textContent=p.t;
  $('#q').innerHTML=p.q;vis('#q',true);vis('#in',true);vis('#bar',false);vis('#count',false);
  inp.placeholder=p.ph;inp.value='';$('#ok').textContent=p.b;inp.disabled=true;$('#ok').disabled=true;
  $('#sub').textContent='';locked=true;
  await say(p.q.replace(/<[^>]+>/g,''),false);
  if(g!==gid)return;arm(g);
}
function arm(g){locked=false;inp.disabled=false;$('#ok').disabled=false;inp.value='';inp.focus();tick(g)}
function tick(g){
  clearInterval(timer);vis('#bar',true);const fill=$('#bar').firstElementChild;
  const T=30000,t0=Date.now();let last=99;
  timer=setInterval(()=>{
    const r=1-(Date.now()-t0)/T;fill.style.width=Math.max(r,0)*100+'%';
    const s=Math.ceil(Math.max(r,0)*T/1000);
    if(s<=10&&s>0&&s!==last){last=s;countdown(s)}
    if(r<=0){clearInterval(timer);attempt(g,'',true)}
  },100);
}
async function attempt(g,val,timeout){
  if(locked||g!==gid)return;
  if(!timeout&&!val.trim())return;
  locked=true;clearInterval(timer);vis('#count',false);beatMs=1600;inp.disabled=true;$('#ok').disabled=true;
  const p=P[q[qi]];
  if(!timeout&&p.re.test(norm(val))){qi++;await say(rnd(praises));return prueba(g)}
  vidas--;sting();hud();const c=$('#card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  if(vidas<=0){await say(rnd(timeout?late:taunts)+' Te quedaste sin vidas. La respuesta era: '+p.ans+'.');return fin(g,false)}
  await say(rnd(timeout?late:taunts)+' Te quedan '+vidas+(vidas===1?' vida.':' vidas.'));
  if(g!==gid)return;arm(g);
}
async function fin(g,win){
  if(g!==gid)return;
  ['#tag','#q','#in','#bar','#count','#hud'].forEach(s=>vis(s,false));vis('#menu',true);
  $('#title').textContent=win?'Eres libre':'Fin del juego';$('#all').textContent='Jugar de nuevo';
  await say(win?(q.length>1?'Lo lograste. Superaste las cuatro pruebas. Esta vez, te dejo ir.':'Superaste la prueba. Esta vez, te dejo ir.'):'Vuelve a intentarlo cuando te atrevas.');
}
P.forEach((p,k)=>{const b=document.createElement('button');b.className='alt';b.textContent=p.tag;b.onclick=()=>run([k]);$('#sel').appendChild(b)});
$('#all').onclick=()=>run([0,1,2,3]);
$('#ok').onclick=()=>attempt(gid,inp.value,false);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')attempt(gid,inp.value,false)});
$('#back').onclick=()=>{gid++;clearInterval(timer);if(synth)synth.cancel();stage.classList.remove('talk');talking=false;setVol();beatMs=1600;showMenu();$('#sub').textContent='Elige tu prueba, jugador.'};
$('#mute').onclick=()=>{voz=!voz;if(!voz&&synth)synth.cancel();$('#mute').textContent='Voz: '+(voz?'activada':'desactivada')};
$('#mus').onclick=()=>{mus=!mus;$('#mus').textContent='Música: '+(mus?'activada':'desactivada');setVol()};
addEventListener('beforeunload',()=>synth&&synth.cancel());
</script>
